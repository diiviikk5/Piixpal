<!doctype html>
<meta charset="utf-8">
<title>Piixpal: lantern</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f3eee3; color: #17121f; font: 400 18px/1.55 "Bricolage Grotesque", system-ui }
  .page { position: relative; max-width: 1000px; margin: 30px auto; padding: 50px 60px; background: #fbf8f1; box-shadow: inset 0 0 0 3px #17121f; height: 640px; box-sizing: border-box }
  h1 { font-size: 64px; letter-spacing: -.04em; line-height: 1; margin: 0 0 14px; max-width: 620px }
  .lead { max-width: 520px }
  .cards { display: flex; gap: 22px; margin-top: 40px }
  .card { width: 210px; padding: 18px; background: #fff; box-shadow: inset 0 0 0 3px #17121f }
  .card b { display: block; font-size: 22px }
  img { position: absolute; right: 60px; top: 60px; width: 240px }
  button { position: absolute; right: 60px; bottom: 50px; font: 600 18px "Bricolage Grotesque"; padding: 14px 22px; background: #17121f; color: #c6f432; border: 0 }
</style>
<div class="page">
  <h1>Something is hiding here.</h1>
  <p class="lead">Every heading, card and picture on this page casts a shadow from your light. Five glims are hiding in them.</p>
  <img src="../site/launch-poster.jpg" alt="">
  <div class="cards"><div class="card"><b>Headings</b>cast shadows</div><div class="card"><b>Cards</b>cast shadows</div><div class="card"><b>Buttons</b>too</div></div>
  <button>Get started</button>
  <piix-lantern id="ln"></piix-lantern>
</div>
<script src="../piixpal.js"></script>
