<script>
/* a clock the renderer owns: time, animation frames and timers only move when it is told to */
(() => {
  let now = 0, seed = 11, tid = 1;
  window.__realNow = performance.now.bind(performance);
  window.__realSetInterval = setInterval.bind(window);
  window.__realClearInterval = clearInterval.bind(window);
  const queue = [], timers = new Map();
  performance.now = () => now;
  Date.now = () => 1790000000000 + now;
  window.requestAnimationFrame = cb => queue.push(cb);
  window.cancelAnimationFrame = () => {};
  window.setTimeout = (fn, ms = 0, ...a) => { const id = tid++; timers.set(id, { at: now + Math.max(0, +ms || 0), fn, a }); return id; };
  window.setInterval = (fn, ms = 0, ...a) => { const id = tid++; timers.set(id, { at: now + Math.max(1, +ms || 0), fn, a, every: Math.max(1, +ms || 0) }); return id; };
  window.clearTimeout = window.clearInterval = id => timers.delete(id);
  Math.random = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  window.__clock = {
    get ms() { return now; },
    step(dt) {
      const end = now + Math.max(0, dt);
      for (let guard = 0; guard < 5000; guard++) {
        let best = null, bid = 0;
        for (const [id, t] of timers) if (t.at <= end && (!best || t.at < best.at)) { best = t; bid = id; }
        if (!best) break;
        now = Math.max(now, best.at);
        if (best.every) best.at += best.every; else timers.delete(bid);
        try { typeof best.fn === 'function' && best.fn(...best.a); } catch (e) { console.error(e); }
      }
      now = end;
      queue.splice(0).forEach(cb => { try { cb(now); } catch (e) { console.error(e); } });
    }
  };
})();
</script>
<style>

<script>
/* 0 to N stars: each pops into the grid as the counter climbs; then the big number and the link */
const N = +(new URLSearchParams(location.search).get('n') || 54), DUR = 5, WARM = 60000;
const STAR = '<svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#17121f" d="M3 0h3v1h1v2h2v3H8v1H7v2H6V8H3v1H2V7H1V6H0V3h2V1h1z"/><path fill="#ffd23f" d="M4 1h1v2h3v1H7v1H6v2H5V6H4v1H3V5H2V4H1V3h3z"/><path fill="#fff4c0" d="M4 1h1v1H4zM2 3h1v1H2z"/></svg>';
const grid = document.getElementById('grid');
const cells = Array.from({ length: N }, () => { const i = document.createElement('i'); i.innerHTML = STAR; grid.appendChild(i); return i; });
document.getElementById('n2').textContent = N;
/* the stars arrive slowly, then faster and faster */
const T0 = .45, T1 = 3.2, arrive = k => T0 + (T1 - T0) * Math.pow(k / N, .6);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const stepTo = ms => { while (ms - __clock.ms > .01) __clock.step(Math.min(1000 / 30, ms - __clock.ms)); };
function frame(T) {
  let shown = 0;
  cells.forEach((c, k) => {
    const a = arrive(k + 1), p = cl((T - a) / .16);
    if (T >= a) shown = k + 1;
    const s = p < 1 ? .2 + Math.floor(p * 4) / 4 * 1.05 : 1;
    c.style.opacity = p > 0 ? 1 : 0; c.style.transform = `scale(${s})`;
  });
  document.getElementById('n').textContent = shown;
  document.getElementById('end').style.opacity = Math.floor(cl((T - 3.55) / .25) * 4) / 4;
  document.getElementById('flash').style.opacity = T > 3.45 && T < 3.75 ? (1 - (T - 3.45) / .3) * .8 : 0;
  document.querySelector('.end .big').style.transform = `scale(${1.25 - Math.floor(cl((T - 3.6) / .3) * 4) / 4 * .25})`;
  document.querySelector('.end piix-sprite').style.transform = `translateY(${T > 3.6 ? -Math.abs(Math.sin((T - 3.6) * 7)) * 30 : 0}px)`;
  stepTo(WARM + T * 1000);
}
const ready = document.fonts.ready.then(() => Promise.all(['800 100px "Bricolage Grotesque"', '400 30px Silkscreen', '600 30px "JetBrains Mono"'].map(f => document.fonts.load(f)))).then(() => stepTo(WARM));
window.__film = { DUR, ready, frame, cues: () => [] };
if (!location.search.includes('render')) ready.then(() => { const t0 = __realNow(); __realSetInterval(() => frame(((__realNow() - t0) / 1000) % DUR), 1000 / 30); });
</script>
