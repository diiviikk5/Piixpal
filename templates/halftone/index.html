<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halftone — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#16151c; --muted:rgba(22,21,28,.6); --line:rgba(22,21,28,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#efeff2; color:var(--ink); font-family:Archivo,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }
  nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:20px clamp(20px,4vw,56px); font:400 12px/1 "JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line); background:rgba(239,239,242,.86); }
  .logo { font-family:Archivo,sans-serif; font-stretch:125%; font-weight:800; font-size:20px; letter-spacing:-.02em; text-transform:none; }
  .links { display:flex; gap:28px; color:var(--muted); } .links a:hover { color:var(--ink); }
  .nb { justify-self:end; }
  .copy { padding:clamp(28px,6vh,64px) clamp(20px,4vw,56px) 0; display:grid; grid-template-columns:1fr auto; gap:40px; align-items:start; }
  h1 { font-stretch:62%; font-weight:800; font-size:clamp(70px,13vw,230px); line-height:.8; letter-spacing:-.02em; text-transform:uppercase; mix-blend-mode:multiply; }
  .side { max-width:300px; padding-top:12px; font-size:15px; line-height:1.55; }
  .side small { display:block; font:400 11px/1.6 "JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .btn { display:inline-block; margin-top:20px; padding:14px 20px; background:var(--ink); color:#efeff2; font:400 12px/1 "JetBrains Mono",monospace; letter-spacing:.1em; text-transform:uppercase; }
  .btn:hover { background:#b0263a; }
  .strip { margin-top:auto; display:flex; justify-content:space-between; padding:14px clamp(20px,4vw,56px); border-top:1px solid var(--line); font:400 11px/1 "JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; background:rgba(239,239,242,.86); }
  .rv { opacity:0; animation:in .8s steps(5) forwards; animation-delay:calc(var(--d,0)*1ms); }
  @keyframes in { to { opacity:1; } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; } }
  @media (max-width:760px){ .links{ display:none; } nav{ grid-template-columns:1fr auto; } .copy{ grid-template-columns:1fr; } .strip span:nth-child(2){ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>
  <nav class="rv"><a class="logo" href="#">Altitude</a><div class="links"><a href="#">Issues</a><a href="#">Prints</a><a href="#">Stockists</a></div><a class="nb" href="#">Cart (0)</a></nav>
  <div class="copy">
    <h1 class="rv" style="--d:200">Print<br>the peaks.</h1>
    <div class="side rv" style="--d:450"><small>Issue 07 · Risograph · 2 inks</small>A quarterly on mountains, printed one ink at a time on a 1998 riso in a garage in Chamonix. 120 pages, no gloss.<br><a class="btn" href="#">Order issue 07 →</a></div>
  </div>
  <div class="strip rv" style="--d:650"><span>Five inks · five peaks</span><span>Shipping worldwide</span><span>€18</span></div>
</section>
<script src="bg.js"></script>
</body>
</html>
