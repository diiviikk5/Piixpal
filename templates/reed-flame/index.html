<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reed Flame — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fff4ee; --muted:rgba(255,244,238,.7); --line:rgba(255,244,238,.2); --hot:#ff7a2f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#16040e; color:var(--fg); font-family:Rajdhani,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(10,0,6,.55),transparent 30%,transparent 60%,rgba(10,0,6,.75)); pointer-events:none; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:20px clamp(20px,4vw,52px); font-weight:600; font-size:16px; letter-spacing:.12em; text-transform:uppercase; }
  .logo { font-family:Teko,sans-serif; font-weight:700; font-size:34px; letter-spacing:.06em; line-height:1; }
  .links { display:flex; gap:28px; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .online { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .online b { color:#7dff9a; font-variant-numeric:tabular-nums; }
  .online i { width:8px; height:8px; border-radius:50%; background:#7dff9a; box-shadow:0 0 10px #7dff9a; }

  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 clamp(20px,4vw,52px); }
  .season { display:inline-flex; gap:10px; align-items:center; font-weight:700; font-size:15px; letter-spacing:.3em; text-transform:uppercase; }
  .season span { padding:4px 10px; background:var(--hot); color:#1a0508; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
  h1 { margin-top:10px; font-family:Teko,sans-serif; font-weight:700; font-size:clamp(96px,17vw,280px); line-height:.78; letter-spacing:.01em; text-transform:uppercase; text-shadow:0 10px 60px rgba(40,0,10,.6); }
  h1 .glitch { position:relative; display:inline-block; }
  h1 .glitch::before, h1 .glitch::after { content:attr(data-t); position:absolute; inset:0; mix-blend-mode:screen; opacity:.75; animation:split 3.2s infinite steps(1); }
  h1 .glitch::before { color:#ff3d6e; } h1 .glitch::after { color:#ffb43d; }
  @keyframes split { 0%,86%,100% { transform:none; clip-path:inset(0); opacity:0; } 88% { transform:translate(-4px,1px); clip-path:inset(20% 0 55% 0); opacity:.8; } 91% { transform:translate(5px,-2px); clip-path:inset(60% 0 10% 0); opacity:.8; } 94% { transform:translate(-2px,0); clip-path:inset(40% 0 35% 0); opacity:.8; } }
  .sub { margin-top:14px; max-width:520px; font-size:20px; font-weight:500; line-height:1.4; color:var(--muted); }
  .ctas { margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; }
  .play { font-family:Teko,sans-serif; font-weight:600; font-size:28px; letter-spacing:.06em; padding:10px 36px 6px; background:var(--hot); color:#1a0508; clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%); transition:filter .25s, transform .25s; }
  .play:hover { filter:brightness(1.12); transform:translateY(-2px); }
  .trailer { font-family:Teko,sans-serif; font-weight:500; font-size:28px; letter-spacing:.06em; padding:10px 32px 6px; border:1px solid var(--line); background:rgba(20,0,8,.35); backdrop-filter:blur(8px); clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%); transition:background .25s; }
  .trailer:hover { background:rgba(255,244,238,.12); }

  .bottom { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; padding:0 clamp(20px,4vw,52px) 28px; }
  .plats { display:flex; gap:8px; flex-wrap:wrap; }
  .plats span { padding:6px 12px; border:1px solid var(--line); font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rank { display:flex; gap:22px; }
  .rank div { text-align:right; }
  .rank b { display:block; font-family:Teko,sans-serif; font-weight:600; font-size:44px; line-height:.9; }
  .rank small { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  .rv { opacity:0; transform:translateX(-20px); animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; } h1 .glitch::before,h1 .glitch::after{ animation:none; opacity:0; } }
  @media (max-width:820px){ .links{ display:none; } .bottom{ flex-direction:column; align-items:flex-start; } .rank div{ text-align:left; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">EMBERFALL</a>
    <div class="links"><a href="#">Game</a><a href="#">Season 4</a><a href="#">Esports</a><a href="#">Store</a></div>
    <span class="online"><i></i><b id="on">184,203</b> online</span>
  </nav>

  <div class="stage">
    <span class="season rv" style="--d:150"><span>Season 4</span>Now live</span>
    <h1 class="rv" style="--d:300"><span class="glitch" data-t="Inferno">Inferno</span></h1>
    <p class="sub rv" style="--d:500">A new map carved from molten glass, three new legends and a ranked ladder that burns hotter every night.</p>
    <div class="ctas rv" style="--d:650"><a class="play" href="#">Play free</a><a class="trailer" href="#">▶ Watch trailer</a></div>
  </div>

  <div class="bottom rv" style="--d:850">
    <div class="plats"><span>PC</span><span>PS5</span><span>Xbox</span><span>Switch 2</span></div>
    <div class="rank"><div><b>3</b><small>New legends</small></div><div><b>1</b><small>New map</small></div><div><b>$2M</b><small>Prize pool</small></div></div>
  </div>
</section>
<script src="bg.js"></script>
<script>
  const on = document.getElementById('on'); let n = 184203;
  setInterval(() => { n += Math.round((Math.random() - .45) * 60); on.textContent = n.toLocaleString(); }, 1500);
</script>
</body>
</html>
