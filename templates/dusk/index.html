<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dusk — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fbf3ea; --muted:rgba(251,243,234,.72); --line:rgba(251,243,234,.25); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#4c5a63; color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; padding:26px clamp(20px,4vw,56px) 34px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  header { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .me { display:flex; align-items:center; gap:12px; }
  .me i { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#d47a2b,#6f7a8c); border:1.5px solid var(--line); display:grid; place-items:center; font-family:Newsreader,serif; font-style:italic; font-size:18px; }
  .avail { display:flex; align-items:center; gap:8px; color:var(--muted); }
  .avail b { width:8px; height:8px; border-radius:50%; background:#9be29b; box-shadow:0 0 0 4px rgba(155,226,155,.18); }
  header nav { display:flex; gap:26px; }
  header nav a { position:relative; color:var(--muted); transition:color .25s; }
  header nav a::after { content:""; position:absolute; left:0; right:0; bottom:-3px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s cubic-bezier(.2,.7,.2,1); }
  header nav a:hover { color:var(--fg); }
  header nav a:hover::after { transform:scaleX(1); transform-origin:left; }

  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:4vh 0; }
  .hello { font-family:Newsreader,serif; font-style:italic; font-size:clamp(20px,2vw,26px); color:var(--muted); }
  h1 { margin-top:12px; font-family:Newsreader,serif; font-weight:300; font-size:clamp(52px,8.6vw,140px); line-height:.92; letter-spacing:-.035em; max-width:13ch; }
  h1 em { font-style:italic; }
  .role { margin-top:30px; display:flex; flex-wrap:wrap; gap:10px 34px; font-size:15px; color:var(--muted); max-width:640px; line-height:1.6; }

  footer { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:20px; font-size:14px; }
  .clock { color:var(--muted); }
  .clock b { display:block; font-family:Newsreader,serif; font-weight:400; font-size:28px; color:var(--fg); font-variant-numeric:tabular-nums; }
  .mail { justify-self:center; display:inline-flex; align-items:center; gap:12px; padding:16px 26px; border-radius:999px; background:var(--fg); color:#3c3330; font-weight:500; transition:transform .3s, box-shadow .3s; }
  .mail:hover { transform:translateY(-2px); box-shadow:0 18px 50px rgba(60,30,10,.3); }
  .mail span { display:inline-block; transition:transform .3s; }
  .mail:hover span { transform:translateX(4px) rotate(-45deg); }
  .social { justify-self:end; display:flex; gap:10px; }
  .social a { width:42px; height:42px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); font-size:13px; transition:background .25s; backdrop-filter:blur(8px); }
  .social a:hover { background:rgba(251,243,234,.15); }

  .rv { opacity:0; transform:translateY(18px); filter:blur(8px); animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:760px){ header nav{ display:none; } footer{ grid-template-columns:1fr; } .mail,.social{ justify-self:start; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <header class="rv">
    <div class="me"><i>a</i><div>Ava Moreno<div class="avail"><b></b>Open to work</div></div></div>
    <nav><a href="#">Work</a><a href="#">Projects</a><a href="#">Writing</a><a href="#">Résumé</a></nav>
  </header>

  <main>
    <p class="hello rv" style="--d:150">Hi, I'm Ava —</p>
    <h1 class="rv" style="--d:300">I build things that feel <em>like evenings.</em></h1>
    <div class="role rv" style="--d:500"><span>Design engineer</span><span>3× hackathon winner</span><span>Previously @ Lumen, Orbital</span></div>
  </main>

  <footer class="rv" style="--d:700">
    <div class="clock">Local time, Bangalore<b id="clock">--:--</b></div>
    <a class="mail" href="mailto:hello@example.com">Say hello <span>→</span></a>
    <div class="social"><a href="#" aria-label="GitHub">GH</a><a href="#" aria-label="X">X</a><a href="#" aria-label="LinkedIn">in</a></div>
  </footer>
</section>
<script src="bg.js"></script>
<script>
  // live clock in your timezone — change TZ
  const TZ = 'Asia/Kolkata', el = document.getElementById('clock');
  const tick = () => el.textContent = new Date().toLocaleTimeString('en-US', { timeZone:TZ, hour:'numeric', minute:'2-digit' });
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
