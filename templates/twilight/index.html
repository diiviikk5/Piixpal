<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Twilight — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fffaf6; --muted:rgba(255,250,246,.78); --ink:#3a2340; --line:rgba(255,250,246,.35); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1a2160; color:var(--fg); font-family:Jost,system-ui,sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; text-align:center; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { width:100%; display:flex; justify-content:center; gap:clamp(18px,4vw,48px); padding:26px 20px; font-size:13px; letter-spacing:.24em; text-transform:uppercase; }
  nav a { opacity:.85; } nav a:hover { opacity:1; }

  .names { margin-top:auto; }
  .save { font-size:13px; letter-spacing:.4em; text-transform:uppercase; padding-left:.4em; }
  h1 { margin-top:16px; font-family:Cormorant,serif; font-weight:400; font-size:clamp(60px,10vw,168px); line-height:.9; letter-spacing:-.01em; }
  h1 em { display:block; font-size:.42em; font-style:italic; margin:.12em 0; opacity:.9; }
  .date { margin-top:22px; font-family:Cormorant,serif; font-style:italic; font-size:clamp(22px,2.2vw,30px); }
  .place { margin-top:6px; font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); font-weight:400; }

  .clock { margin-top:34px; display:flex; gap:clamp(18px,3vw,40px); justify-content:center; }
  .clock div b { display:block; color:var(--ink); font-family:Cormorant,serif; font-weight:500; font-size:clamp(34px,3.6vw,52px); font-variant-numeric:tabular-nums; line-height:1; }
  .clock div small { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink); font-weight:500; }

  .rsvp { margin:34px 0 auto; display:inline-flex; align-items:center; gap:12px; padding:16px 34px; border-radius:999px; background:var(--fg); color:var(--ink); font-weight:500; font-size:14px; letter-spacing:.2em; text-transform:uppercase; transition:transform .3s, box-shadow .3s; }
  .rsvp:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(58,35,64,.3); }
  .foot { padding:0 20px 26px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); font-weight:500; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(10px); animation:rise 1.6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:640px){ nav a:nth-child(n+4){ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv"><a href="#">Our story</a><a href="#">Schedule</a><a href="#">Travel</a><a href="#">Registry</a><a href="#">FAQ</a></nav>

  <div class="names">
    <span class="save rv" style="--d:200">Save the date</span>
    <h1 class="rv" style="--d:400">Maya<em>&amp;</em>Leo</h1>
    <p class="date rv" style="--d:700">Saturday, the twentieth of June</p>
    <p class="place rv" style="--d:800">Villa Solare · Amalfi Coast</p>
    <div class="clock rv" style="--d:1000" aria-label="Countdown">
      <div><b id="d">000</b><small>Days</small></div><div><b id="h">00</b><small>Hours</small></div><div><b id="m">00</b><small>Minutes</small></div>
    </div>
  </div>
  <a class="rsvp rv" style="--d:1200" href="#">RSVP by May 1 →</a>
  <p class="foot rv" style="--d:1400">Dinner &amp; dancing to follow</p>
</section>
<script src="bg.js"></script>
<script>
  // countdown to June 20 (next occurrence), 5pm local
  const now = new Date(); let y = now.getFullYear(); let target = new Date(y, 5, 20, 17);
  if (target < now) target = new Date(y + 1, 5, 20, 17);
  const p = n => String(n).padStart(2, '0');
  const tick = () => { const s = Math.max(0, (target - Date.now()) / 1000 | 0); d.textContent = s / 86400 | 0; h.textContent = p((s % 86400) / 3600 | 0); m.textContent = p((s % 3600) / 60 | 0); };
  tick(); setInterval(tick, 30000);
</script>
</body>
</html>
