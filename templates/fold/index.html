<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fold — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0d0b10; --muted:rgba(13,11,16,.58); --line:rgba(13,11,16,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; color:var(--ink); font-family:"Inter Tight",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:24px clamp(20px,4vw,56px); font-size:14px; }
  .logo { font-weight:600; font-size:18px; letter-spacing:-.02em; }
  .logo i { font-family:"Instrument Serif",serif; font-weight:400; font-size:21px; }
  .links { display:flex; gap:28px; color:var(--muted); }
  .links a:hover { color:var(--ink); }
  .nb { justify-self:end; font-weight:500; display:flex; align-items:center; gap:8px; }
  .nb::before { content:""; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.18); }

  .copy { margin-top:auto; padding:0 clamp(20px,4vw,56px) clamp(28px,6vh,64px); display:grid; grid-template-columns:1.6fr 1fr; gap:40px; align-items:end; }
  h1 { font-weight:500; font-size:clamp(56px,9.4vw,168px); line-height:.86; letter-spacing:-.06em; }
  h1 em { font-family:"Instrument Serif",serif; font-weight:400; font-style:italic; letter-spacing:-.025em; }
  .side { padding-bottom:12px; text-shadow:0 0 18px #fff,0 0 4px #fff; }
  .sub { font-size:17px; line-height:1.55; color:var(--muted); max-width:380px; }
  .ctas { margin-top:26px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn { padding:15px 24px; border-radius:999px; font-weight:500; font-size:15px; transition:transform .25s, box-shadow .25s, background .25s; }
  .btn.p { background:var(--ink); color:#fff; } .btn.p:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(255,70,30,.28); }
  .btn.g { background:rgba(255,255,255,.6); border:1px solid var(--line); backdrop-filter:blur(10px); } .btn.g:hover { background:#fff; }
  .clients { margin-top:30px; font-size:12px; color:var(--muted); letter-spacing:.04em; display:flex; gap:18px; flex-wrap:wrap; text-transform:uppercase; }

  .rv { opacity:0; transform:translateY(18px); filter:blur(10px); animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:860px){ .links{ display:none; } nav{ grid-template-columns:1fr auto; } .copy{ grid-template-columns:1fr; gap:24px; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">Crease <i>&amp; Co.</i></a>
    <div class="links"><a href="#">Work</a><a href="#">Studio</a><a href="#">Services</a><a href="#">Journal</a></div>
    <a class="nb" href="#">Booking Q3</a>
  </nav>

  <div class="copy">
    <h1 class="rv" style="--d:300">Brands that<br><em>bend,</em> never<br>break.</h1>
    <div class="side">
      <p class="sub rv" style="--d:550">An independent design studio for identity, motion and the web. We take a flat idea and give it a fold, so it catches the light.</p>
      <div class="ctas rv" style="--d:700"><a class="btn p" href="#">Start a project</a><a class="btn g" href="#">See the work</a></div>
      <div class="clients rv" style="--d:900"><span>Halcyon</span><span>Northwind</span><span>Oda Studio</span><span>Field &amp; Form</span></div>
    </div>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
