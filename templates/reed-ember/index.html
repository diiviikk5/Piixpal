<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reed Ember — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#f3ece4; --muted:rgba(243,236,228,.6); --line:rgba(243,236,228,.18); --ember:#e8701c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#081016; color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .mono { font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; padding:24px clamp(20px,4vw,52px) 32px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { display:flex; justify-content:space-between; align-items:center; }
  .logo { font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:26px; letter-spacing:.04em; }
  .logo i { color:var(--ember); font-style:normal; }
  .links { display:flex; gap:30px; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .rec { display:flex; align-items:center; gap:8px; color:var(--muted); }
  .rec b { width:8px; height:8px; border-radius:50%; background:#ff3b2f; animation:blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.15; } }

  main { flex:1; display:grid; grid-template-columns:1.2fr 1fr; align-items:end; gap:clamp(24px,4vw,64px); padding-top:6vh; }
  h1 { font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:clamp(72px,13.5vw,232px); line-height:.82; letter-spacing:-.01em; text-transform:uppercase; }
  h1 .o { color:var(--ember); }
  h1 .l { display:block; overflow:hidden; }
  h1 .l > span { display:block; transform:translateY(102%); animation:up 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  h1 .l:nth-child(2) > span { animation-delay:.12s; }
  @keyframes up { to { transform:none; } }
  .side { padding-bottom:12px; }
  .side p { color:var(--muted); font-size:16px; line-height:1.6; max-width:380px; }

  .reel { margin-top:24px; position:relative; display:block; aspect-ratio:16/9; width:min(420px,100%); border-radius:6px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(120deg,rgba(232,112,28,.35),rgba(8,16,22,.6) 60%); backdrop-filter:blur(6px); transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .reel:hover { transform:scale(1.02); }
  .reel::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px); }
  .reel .play { position:absolute; inset:0; margin:auto; width:64px; height:64px; border-radius:50%; background:var(--fg); color:#081016; display:grid; place-items:center; transition:transform .3s, background .3s; }
  .reel:hover .play { transform:scale(1.1); background:var(--ember); color:#fff; }
  .reel .play svg { width:20px; height:20px; margin-left:3px; }
  .reel .tl { position:absolute; left:12px; top:10px; } .reel .tr { position:absolute; right:12px; top:10px; } .reel .bl { position:absolute; left:12px; bottom:10px; }
  .reel .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.12); }
  .reel .bar i { display:block; height:100%; width:0; background:var(--ember); animation:prog 14s linear infinite; }
  @keyframes prog { to { width:100%; } }

  .foot { margin-top:28px; display:flex; justify-content:space-between; gap:20px; color:var(--muted); border-top:1px solid var(--line); padding-top:16px; }
  .foot span b { color:var(--fg); font-weight:400; }

  .rv { opacity:0; transform:translateY(14px); animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .rv,h1 .l>span{ animation:none; opacity:1; transform:none; } .rec b,.reel .bar i{ animation:none; } }
  @media (max-width:860px){ .links{ display:none; } main{ grid-template-columns:1fr; } .foot{ flex-wrap:wrap; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">KILN<i>/</i>FILMS</a>
    <div class="links mono"><a href="#">Work</a><a href="#">Directors</a><a href="#">Studio</a><a href="#">Contact</a></div>
    <span class="rec mono"><b></b>Rec 2026</span>
  </nav>

  <main>
    <h1><span class="l"><span>We shoot</span></span><span class="l"><span>light<span class="o">.</span></span></span></h1>
    <div class="side">
      <p class="rv" style="--d:500">A production house for brands that want to be felt. Commercials, music videos and launch films, lit like they mean it.</p>
      <a class="reel rv" style="--d:700" href="#" aria-label="Play showreel">
        <span class="tl mono">Showreel</span><span class="tr mono">02:14</span><span class="bl mono">4K · 24fps</span>
        <span class="play"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M2 1l11 6-11 6z"/></svg></span>
        <span class="bar"><i></i></span>
      </a>
    </div>
  </main>

  <div class="foot mono rv" style="--d:900">
    <span><b>140+</b> films shipped</span><span><b>12</b> Cannes Lions</span><span>Clients — Lumen, Orbital, Halcyon</span>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
