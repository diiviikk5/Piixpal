<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mercury — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#f2f2f6; --muted:rgba(242,242,246,.55); --line:rgba(242,242,246,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#030305; color:var(--fg); font-family:Geist,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .mono { font-family:"Geist Mono",monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }

  .hero { position:relative; height:100vh; height:100svh; min-height:640px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { position:absolute; inset:0 0 auto; display:flex; justify-content:space-between; align-items:center; padding:22px clamp(20px,4vw,52px); }
  .logo { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; letter-spacing:-.02em; }
  .logo i { width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#8d8fa0 40%,#1a1a22 75%); box-shadow:0 0 14px rgba(160,140,255,.4); }
  .links { display:flex; gap:28px; font-size:14px; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .nb { font-size:14px; font-weight:500; padding:9px 16px; border-radius:999px; background:var(--fg); color:#050507; }

  .eyebrow { position:absolute; top:15%; left:0; right:0; text-align:center; color:var(--muted); }
  .eyebrow b { color:#b7a6ff; font-weight:400; }

  .bottom { position:absolute; left:0; right:0; bottom:0; padding:0 clamp(20px,4vw,52px) 30px; }
  h1 { font-weight:300; font-size:clamp(56px,10.5vw,176px); line-height:.86; letter-spacing:-.065em; text-align:center; background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.35)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .row { margin-top:22px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; border-top:1px solid var(--line); padding-top:18px; }
  .row p { font-size:15px; line-height:1.5; color:var(--muted); max-width:340px; }
  .ctas { display:flex; gap:10px; }
  .btn { padding:13px 22px; border-radius:999px; font-size:14px; font-weight:500; transition:transform .25s, box-shadow .25s, background .25s; }
  .btn.p { background:var(--fg); color:#050507; } .btn.p:hover { transform:translateY(-1px); box-shadow:0 0 0 6px rgba(183,166,255,.15); }
  .btn.s { border:1px solid var(--line); } .btn.s:hover { background:rgba(255,255,255,.06); }
  .stats { justify-self:end; display:flex; gap:28px; }
  .stats b { display:block; font-weight:400; font-size:22px; letter-spacing:-.03em; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(10px); animation:rise 1.3s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:860px){ .links,.stats{ display:none; } .row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#"><i></i>Mercury</a>
    <div class="links"><a href="#">Runtime</a><a href="#">Models</a><a href="#">Docs</a><a href="#">Pricing</a></div>
    <a class="nb" href="#">Get API key</a>
  </nav>

  <p class="eyebrow mono rv" style="--d:300"><b>●</b> Adaptive inference runtime · v2</p>

  <div class="bottom">
    <h1 class="rv" style="--d:500">Takes any shape.</h1>
    <div class="row rv" style="--d:800">
      <p>One API that reshapes itself around your workload — batching, routing and scaling models the moment traffic changes.</p>
      <div class="ctas"><a class="btn p" href="#">Start building</a><a class="btn s" href="#">Read the docs</a></div>
      <div class="stats mono"><div><b>38ms</b>p50 latency</div><div><b>−61%</b>GPU cost</div></div>
    </div>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
