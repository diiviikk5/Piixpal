<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#3a1412; --muted:rgba(58,20,18,.68); --pink:#e8506a; --yellow:#f7d63e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#e9a08e; color:var(--ink); font-family:Rubik,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; cursor:pointer; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; padding:22px clamp(20px,4vw,56px) 30px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { display:flex; justify-content:space-between; align-items:center; }
  .logo { font-weight:900; font-size:22px; letter-spacing:-.03em; }
  .logo span { color:var(--pink); }
  .links { display:flex; gap:26px; font-weight:500; font-size:15px; }
  .links a { opacity:.75; } .links a:hover { opacity:1; }
  .cart { width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; position:relative; }
  .cart b { position:absolute; top:-4px; right:-4px; width:18px; height:18px; border-radius:50%; background:var(--yellow); color:var(--ink); font-size:11px; display:grid; place-items:center; }

  .copy { margin:auto 0; max-width:min(560px,50vw); }
  .tag { display:inline-flex; gap:8px; align-items:center; font-weight:500; font-size:14px; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.55); }
  .tag i { width:8px; height:8px; border-radius:50%; background:#2ec27e; }
  h1 { margin-top:18px; font-weight:900; font-size:clamp(52px,7vw,112px); line-height:.9; letter-spacing:-.05em; }
  .sub { margin-top:18px; font-size:18px; line-height:1.5; color:var(--muted); max-width:430px; }
  .colors { margin-top:24px; display:flex; align-items:center; gap:12px; font-size:14px; font-weight:500; }
  .colors button { width:30px; height:30px; border-radius:50%; border:3px solid #fff; background:var(--c); box-shadow:0 2px 8px rgba(58,20,18,.2); transition:transform .2s; }
  .colors button.on { outline:2px solid var(--ink); outline-offset:2px; transform:scale(1.1); }
  .buy { margin-top:24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .btn { padding:17px 30px; border-radius:16px; background:var(--ink); color:#fff; font-weight:700; font-size:16px; box-shadow:0 6px 0 #1d0807; transition:transform .1s, box-shadow .1s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 0 #1d0807; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #1d0807; }
  .price b { font-size:28px; font-weight:900; } .price s { margin-left:6px; color:var(--muted); }

  .specs { display:flex; gap:10px; flex-wrap:wrap; }
  .specs span { padding:9px 14px; border-radius:12px; background:rgba(255,255,255,.55); font-size:14px; font-weight:500; backdrop-filter:blur(6px); }

  .rv { opacity:0; transform:translateY(16px); animation:rise .9s cubic-bezier(.2,.9,.2,1.15) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; } }
  @media (max-width:820px){ .links{ display:none; } .copy{ max-width:none; padding:24px; border-radius:24px; background:rgba(255,255,255,.6); backdrop-filter:blur(10px); margin-top:24px; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg data-focus=".7,.5" aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">pocket<span>.</span></a>
    <div class="links"><a href="#">Device</a><a href="#">Games</a><a href="#">Cartridges</a><a href="#">Support</a></div>
    <a class="cart" href="#" aria-label="Cart"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6h15l-2 9H8L6 3H3"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><b>1</b></a>
  </nav>

  <div class="copy">
    <span class="tag rv" style="--d:150"><i></i>Ships in 2 weeks</span>
    <h1 class="rv" style="--d:300">Play like it's '89 again.</h1>
    <p class="sub rv" style="--d:450">A modern handheld with a backlit LCD, USB-C, 40-hour battery and every cartridge you loved. Just the good parts of nostalgia.</p>
    <div class="colors rv" style="--d:600" id="colors">
      <button class="on" style="--c:#f7d63e" aria-label="Lemon"></button><button style="--c:#e8506a" aria-label="Cherry"></button><button style="--c:#79c7e8" aria-label="Sky"></button><button style="--c:#e9e4dc" aria-label="Classic grey"></button>
      <span id="cname">Lemon</span>
    </div>
    <div class="buy rv" style="--d:750"><a class="btn" href="#">Pre-order now</a><span class="price"><b>$99</b><s>$129</s></span></div>
  </div>

  <div class="specs rv" style="--d:900"><span>🔋 40h battery</span><span>⚡ USB-C</span><span>💡 Backlit LCD</span><span>🎮 Plays original carts</span></div>
</section>
<script src="bg.js"></script>
<script>
  const names = ['Lemon', 'Cherry', 'Sky', 'Classic grey'];
  document.getElementById('colors').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const all = [...document.querySelectorAll('#colors button')];
    all.forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('cname').textContent = names[all.indexOf(b)];
  };
</script>
</body>
