<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aura — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#1f1410; --muted:rgba(31,20,16,.58); --line:rgba(31,20,16,.12); --hot:#ff5a1f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fffdf9; color:var(--ink); font-family:Outfit,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { display:flex; align-items:center; justify-content:space-between; padding:24px clamp(20px,4vw,56px); }
  .logo { font-weight:600; font-size:22px; letter-spacing:-.04em; display:flex; align-items:center; gap:8px; }
  .logo i { width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 60% 35%,#ffc21a,#ff5a1f 55%,#ff2a4a); filter:blur(.5px); }
  .links { display:flex; gap:6px; padding:5px; border-radius:999px; background:rgba(255,255,255,.6); border:1px solid var(--line); backdrop-filter:blur(12px); font-size:14px; }
  .links a { padding:8px 16px; border-radius:999px; color:var(--muted); transition:background .25s, color .25s; }
  .links a:hover, .links a.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .get { font-size:14px; font-weight:500; padding:11px 20px; border-radius:999px; background:var(--ink); color:#fff; transition:transform .25s; }
  .get:hover { transform:translateY(-1px); }

  .wrap { flex:1; display:flex; align-items:center; padding:0 clamp(20px,4vw,56px) 8vh; }
  .copy { max-width:620px; }
  .breath { display:inline-flex; align-items:center; gap:10px; padding:7px 14px 7px 8px; border-radius:999px; background:rgba(255,255,255,.7); border:1px solid var(--line); font-size:14px; color:var(--muted); backdrop-filter:blur(10px); }
  .breath b { width:20px; height:20px; border-radius:50%; background:radial-gradient(circle,#ff9a3d,#ff5a1f); animation:breathe 8s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(.6); opacity:.7; } 50% { transform:scale(1); opacity:1; } }
  h1 { margin-top:24px; font-weight:400; font-size:clamp(50px,7.4vw,112px); line-height:.98; letter-spacing:-.055em; }
  h1 b { font-weight:600; }
  .sub { margin-top:24px; font-size:19px; font-weight:300; line-height:1.55; color:var(--muted); max-width:470px; }
  .ctas { margin-top:36px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .store { display:inline-flex; align-items:center; gap:10px; padding:12px 22px 12px 18px; border-radius:16px; background:var(--ink); color:#fff; transition:transform .25s, box-shadow .25s; }
  .store:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(255,90,31,.25); }
  .store svg { width:22px; height:22px; }
  .store small { display:block; font-size:11px; opacity:.7; }
  .store span { font-weight:500; font-size:16px; line-height:1.1; }
  .rating { font-size:14px; color:var(--muted); }
  .rating b { color:var(--hot); letter-spacing:2px; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(8px); animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } .breath b{ animation:none; } }
  @media (max-width:820px){ .links{ display:none; } .wrap{ align-items:flex-end; } }
</style>
</head>
<body>
<section class="hero">
  <!-- data-focus moves the orb: "x,y" in 0..1 from bottom-left -->
  <canvas data-bg data-focus=".7,.5" aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#"><i></i>aura</a>
    <div class="links"><a class="on" href="#">App</a><a href="#">Science</a><a href="#">Stories</a><a href="#">Pricing</a></div>
    <a class="get" href="#">Get the app</a>
  </nav>

  <div class="wrap">
    <div class="copy">
      <span class="breath rv" style="--d:150"><b></b><span id="cue">Breathe in…</span></span>
      <h1 class="rv" style="--d:300">Feel better, <b>one breath</b> at a time.</h1>
      <p class="sub rv" style="--d:450">Aura listens to how you're doing and shapes a two-minute reset around it. No streaks, no guilt, just a little more calm.</p>
      <div class="ctas rv" style="--d:600">
        <a class="store" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-1-2.4-4zM14 5.6c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg><div><small>Download on the</small><span>App Store</span></div></a>
        <span class="rating"><b>★★★★★</b> 4.9 · 18k ratings</span>
      </div>
    </div>
  </div>
</section>
<script src="bg.js"></script>
<script>
  // cue text in sync with the 8s breathing dot
  const cue = document.getElementById('cue'); let inhale = true;
  setInterval(() => { inhale = !inhale; cue.textContent = inhale ? 'Breathe in…' : 'Breathe out…'; }, 4000);
</script>
</body>
</html>
