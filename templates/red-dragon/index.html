<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Red Dragon — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fff1e8; --muted:rgba(255,241,232,.7); --ember:#ff6a2b; --line:rgba(255,160,110,.3); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#140404; color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; height:100vh; height:100svh; min-height:640px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(10,2,2,.72),rgba(10,2,2,.2) 38%,transparent 55%),linear-gradient(0deg,rgba(10,2,2,.75),transparent 30%); pointer-events:none; }

  nav { position:absolute; inset:0 0 auto; display:flex; justify-content:space-between; align-items:center; padding:24px clamp(20px,4vw,52px); font-size:13px; letter-spacing:.16em; text-transform:uppercase; }
  .auth { font-family:"Cormorant Garamond",serif; font-size:22px; letter-spacing:.06em; text-transform:none; font-style:italic; }
  .links { display:flex; gap:28px; color:#fff1e8; text-shadow:0 1px 3px rgba(20,0,0,.9), 0 0 16px rgba(20,0,0,.8); }
  .links a:hover { color:var(--fg); }

  .top { position:absolute; left:clamp(20px,4vw,52px); top:15%; max-width:430px; }
  .series { font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--ember); }
  h1 { margin-top:14px; font-family:"Cinzel Decorative",serif; font-weight:700; font-size:clamp(44px,5.4vw,84px); line-height:1; text-shadow:0 0 40px rgba(255,80,30,.35); }
  .quote { margin-top:18px; font-family:"Cormorant Garamond",serif; font-style:italic; font-size:21px; line-height:1.4; color:var(--muted); }
  .quote small { display:block; margin-top:6px; font-family:Inter,sans-serif; font-style:normal; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,241,232,.5); }

  .bottom { position:absolute; left:clamp(20px,4vw,52px); right:clamp(20px,4vw,52px); bottom:34px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
  .buy { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { padding:15px 26px; font-size:14px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; transition:background .3s, color .3s, transform .3s; }
  .btn.p { background:var(--ember); color:#1a0603; } .btn.p:hover { background:#ff874f; transform:translateY(-2px); }
  .btn.s { border:1px solid var(--line); background:rgba(20,4,4,.4); backdrop-filter:blur(8px); } .btn.s:hover { background:rgba(255,106,43,.15); }
  .release { text-align:right; }
  .release small { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  .release b { display:block; font-family:"Cinzel Decorative",serif; font-size:clamp(26px,2.6vw,38px); margin-top:4px; }
  .release span { font-size:13px; color:var(--muted); }

  .rv { opacity:0; transform:translateY(16px); filter:blur(10px); animation:rise 1.5s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:820px){ .links{ display:none; } .release{ text-align:left; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="auth" href="#">S. L. Morrow</a>
    <div class="links"><a href="#">Books</a><a href="#">The world</a><a href="#">Events</a><a href="#">Newsletter</a></div>
  </nav>

  <div class="top">
    <span class="series rv" style="--d:300">The Ash Crown · Book III</span>
    <h1 class="rv" style="--d:500">Emberborn</h1>
    <p class="quote rv" style="--d:800">"A ferocious, gorgeous finale. I read it in one sitting and then started again."<small>— The Fantasy Review</small></p>
  </div>

  <div class="bottom">
    <div class="buy rv" style="--d:1100"><a class="btn p" href="#">Pre-order hardcover</a><a class="btn s" href="#">Read chapter one</a></div>
    <div class="release rv" style="--d:1300"><small>Release</small><b>03 · 14</b><span>Signed editions while they last</span></div>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
