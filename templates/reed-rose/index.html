<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reed Rose — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fff; --ink:#2b1630; --muted:rgba(255,255,255,.82); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#e0758a; color:var(--fg); font-family:"Hanken Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { margin:18px auto 0; width:min(1100px,calc(100% - 32px)); display:flex; justify-content:space-between; align-items:center; padding:10px 10px 10px 22px; border-radius:16px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%); }
  .logo { font-weight:800; font-size:19px; letter-spacing:-.03em; }
  .links { display:flex; gap:26px; font-size:15px; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .cta { padding:10px 18px; border-radius:10px; background:var(--ink); font-weight:500; font-size:15px; transition:transform .25s; }
  .cta:hover { transform:translateY(-1px); }

  .content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px 60px; }
  .pill { display:inline-flex; gap:8px; align-items:center; padding:6px 14px; border-radius:999px; background:rgba(43,22,48,.18); font-size:14px; }
  h1 { margin-top:22px; font-weight:800; font-size:clamp(48px,8vw,128px); line-height:.92; letter-spacing:-.055em; max-width:14ch; text-shadow:0 8px 40px rgba(120,30,70,.25); }
  h1 i { font-weight:400; letter-spacing:-.04em; }
  .sub { margin-top:22px; max-width:500px; font-size:19px; line-height:1.5; color:var(--muted); }
  .ctas { margin-top:34px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .big { padding:16px 28px; border-radius:14px; font-weight:700; font-size:16px; transition:transform .25s, box-shadow .25s; }
  .big.dark { background:var(--ink); }
  .big.dark:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(43,22,48,.35); }
  .big.light { background:rgba(255,255,255,.9); color:var(--ink); }
  .big.light:hover { transform:translateY(-2px); }

  /* swatches that cycle through the palette */
  .swatches { margin-top:46px; display:flex; gap:10px; }
  .swatches i { width:44px; height:58px; border-radius:10px; border:1px solid rgba(255,255,255,.5); box-shadow:0 10px 30px rgba(43,22,48,.15); animation:sway 5s ease-in-out infinite; }
  .swatches i:nth-child(1){ background:#ee6145; } .swatches i:nth-child(2){ background:#f48cae; animation-delay:.2s; } .swatches i:nth-child(3){ background:#fbd3dd; animation-delay:.4s; } .swatches i:nth-child(4){ background:#b89fe0; animation-delay:.6s; } .swatches i:nth-child(5){ background:#3f4a63; animation-delay:.8s; }
  @keyframes sway { 50% { transform:translateY(-10px) rotate(-3deg); } }

  .rv { opacity:0; transform:translateY(16px); filter:blur(8px); animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } .swatches i{ animation:none; } }
  @media (max-width:760px){ .links{ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">reed.</a>
    <div class="links"><a href="#">Tokens</a><a href="#">Components</a><a href="#">Figma plugin</a><a href="#">Pricing</a></div>
    <a class="cta" href="#">Start free</a>
  </nav>

  <div class="content">
    <span class="pill rv" style="--d:150">✿ Now with variable color themes</span>
    <h1 class="rv" style="--d:300">Design systems that feel <i>handmade.</i></h1>
    <p class="sub rv" style="--d:450">Reed turns your brand into tokens, components and docs that stay in sync from Figma to production. Beautiful by default, yours by design.</p>
    <div class="ctas rv" style="--d:600"><a class="big dark" href="#">Build your system</a><a class="big light" href="#">See examples</a></div>
    <div class="swatches rv" style="--d:800" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
