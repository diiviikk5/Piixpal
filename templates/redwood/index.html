<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redwood — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fbf8f1; --muted:rgba(251,248,241,.75); --line:rgba(251,248,241,.25); --moss:#c9e27a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#16210f; color:var(--fg); font-family:"DM Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(10,16,8,.45),transparent 28%,transparent 50%,rgba(10,16,8,.7)); pointer-events:none; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:24px clamp(20px,4vw,56px); text-shadow:0 1px 12px rgba(0,0,0,.45); }
  .logo { font-family:"DM Serif Display",serif; font-size:26px; display:flex; align-items:center; gap:10px; }
  .logo svg { width:22px; height:26px; }
  .links { display:flex; gap:30px; font-size:15px; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .host { font-size:15px; font-weight:500; padding:10px 18px; border-radius:999px; border:1px solid var(--line); backdrop-filter:blur(10px); transition:background .3s; }
  .host:hover { background:rgba(255,255,255,.12); }

  .content { margin-top:auto; padding:0 clamp(20px,4vw,56px) clamp(28px,6vh,64px); }
  .kicker { font-size:14px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--moss); }
  h1 { margin-top:14px; font-family:"DM Serif Display",serif; font-weight:400; font-size:clamp(56px,8.4vw,136px); line-height:.92; letter-spacing:-.02em; max-width:12ch; text-shadow:0 6px 40px rgba(0,0,0,.35); }
  h1 em { color:var(--moss); }

  .search { margin-top:32px; display:grid; grid-template-columns:1.3fr 1fr 1fr auto; align-items:center; max-width:880px; padding:8px; border-radius:22px; background:rgba(20,28,16,.45); border:1px solid var(--line); backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%); box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .field { padding:10px 18px; border-radius:16px; transition:background .25s; cursor:text; }
  .field:hover { background:rgba(255,255,255,.08); }
  .field + .field { border-left:1px solid var(--line); }
  .field label { display:block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .field input { width:100%; margin-top:4px; background:none; border:0; outline:0; color:var(--fg); font:inherit; font-size:16px; }
  .field input::placeholder { color:rgba(251,248,241,.5); }
  .search button { display:flex; align-items:center; gap:8px; padding:16px 24px; border:0; border-radius:16px; background:var(--moss); color:#1b2611; font-weight:600; font-size:16px; cursor:pointer; transition:transform .25s, filter .25s; }
  .search button:hover { transform:scale(1.03); filter:brightness(1.05); }
  .search svg { width:18px; height:18px; }

  .chips { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; font-size:14px; }
  .chips a { padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid var(--line); backdrop-filter:blur(8px); transition:background .25s; }
  .chips a:hover { background:rgba(255,255,255,.2); }

  .rv { opacity:0; transform:translateY(18px); filter:blur(8px); animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:820px){ .links{ display:none; } .search{ grid-template-columns:1fr; } .field + .field{ border-left:0; border-top:1px solid var(--line); } .search button{ justify-content:center; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#"><svg viewBox="0 0 22 26" fill="currentColor"><path d="M11 0l7 10h-3.5l5.5 8H13v8h-4v-8H2l5.5-8H4z"/></svg>Understory</a>
    <div class="links"><a href="#">Cabins</a><a href="#">Treehouses</a><a href="#">Guides</a><a href="#">Journal</a></div>
    <a class="host" href="#">Become a host</a>
  </nav>

  <div class="content">
    <span class="kicker rv" style="--d:150">2,400 off-grid stays</span>
    <h1 class="rv" style="--d:300">Find your <em>quiet</em> among the giants.</h1>
    <form class="search rv" style="--d:500" onsubmit="event.preventDefault()">
      <div class="field"><label for="w">Where</label><input id="w" placeholder="Sequoia National Forest" /></div>
      <div class="field"><label for="d">When</label><input id="d" placeholder="Add dates" /></div>
      <div class="field"><label for="g">Guests</label><input id="g" placeholder="2 adults" /></div>
      <button type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
    </form>
    <div class="chips rv" style="--d:650"><a href="#">🔥 Fire pit</a><a href="#">🌲 Forest view</a><a href="#">🛁 Outdoor tub</a><a href="#">🐾 Pet friendly</a></div>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
