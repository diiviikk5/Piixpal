<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eclipse — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0d1b1e; --ink-soft:rgba(13,27,30,.66); --light:#e9ece6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0a1014; color:var(--ink); font-family:Manrope,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  #orbit { position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  #orbit .spin { animation:spin 90s linear infinite; }
  #orbit .spin2 { animation:spin 140s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }

  nav { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:26px clamp(20px,4vw,56px); color:var(--ink); }
  .logo { display:flex; align-items:center; gap:10px; font-family:Fraunces,serif; font-size:22px; font-weight:500; letter-spacing:-.02em; }
  .logo span { width:18px; height:18px; border-radius:50%; border:1.5px solid currentColor; box-shadow:inset -6px 0 0 currentColor; }
  .links { display:flex; gap:34px; font-size:14px; }
  .links a { opacity:.85; } .links a:hover { opacity:1; }
  nav .cta { font-size:14px; font-weight:600; padding:10px 18px; border-radius:999px; background:rgba(233,236,230,.1); color:var(--light); border:1px solid rgba(233,236,230,.22); backdrop-filter:blur(12px); transition:background .3s; }
  nav .cta:hover { background:rgba(233,236,230,.2); }

  .content { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 clamp(20px,4vw,56px) 10vh; max-width:min(820px,52vw); }
  .eyebrow { display:inline-flex; align-items:center; gap:10px; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .eyebrow::before { content:""; width:28px; height:1.5px; background:currentColor; }
  h1 { margin-top:22px; font-family:Fraunces,serif; font-weight:350; font-variation-settings:"opsz" 144; font-size:clamp(46px,6.2vw,112px); line-height:.95; letter-spacing:-.035em; }
  h1 em { font-style:italic; font-weight:300; color:#2b5d58; }
  .sub { margin-top:26px; font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:460px; }
  .ctas { margin-top:36px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:15px 26px; border-radius:999px; background:var(--ink); color:var(--light); font-weight:600; font-size:15px; transition:transform .3s, box-shadow .3s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(13,27,30,.3); }
  .btn i { width:8px; height:8px; border-radius:50%; background:#9fd8c2; box-shadow:0 0 10px #9fd8c2; }
  .link { font-weight:600; font-size:15px; border-bottom:1.5px solid rgba(13,27,30,.3); padding-bottom:2px; transition:border-color .3s; }
  .link:hover { border-color:var(--ink); }

  .totality { position:absolute; right:clamp(20px,4vw,56px); bottom:clamp(24px,5vh,48px); text-align:right; color:var(--light); }
  .totality small { display:block; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  .totality b { display:block; margin-top:6px; font-family:Fraunces,serif; font-weight:300; font-size:clamp(34px,4vw,56px); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(8px); animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  nav.rv { filter:none; }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } #orbit g{ animation:none; } }
  @media (max-width:820px){ .links{ display:none; } .totality{ display:none; } .content{ max-width:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>
  <svg id="orbit" aria-hidden="true"></svg>

  <nav class="rv">
    <a class="logo" href="#"><span></span>Umbra</a>
    <div class="links"><a href="#">Platform</a><a href="#">Datasets</a><a href="#">Field notes</a><a href="#">About</a></div>
    <a class="cta" href="#">Book a demo</a>
  </nav>

  <div class="content">
    <span class="eyebrow rv" style="--d:150">Climate intelligence</span>
    <h1 class="rv" style="--d:300">Quiet tools for <em>loud</em> ideas.</h1>
    <p class="sub rv" style="--d:500">Umbra reads satellite, sensor and grid data so your team can see what's coming and act before it gets loud.</p>
    <div class="ctas rv" style="--d:650">
      <a class="btn" href="#"><i></i>Explore the platform</a>
      <a class="link" href="#">Read field notes</a>
    </div>
  </div>

  <div class="totality rv" style="--d:900">
    <small>Totality in</small>
    <b id="clock">02:14:09</b>
  </div>
</section>
<script src="bg.js"></script>
<script>
// Orbit rings sit on the photo's dark disc. The circle is measured in image space
// (centre x = 1.54 × width, y = 1.3 × height from the top, radius = 1.87 × height) and mapped
// through the same cover-fit as bg.js (zoom 1.06), so it lines up at any screen size.
(() => {
  const hero = document.querySelector('.hero'), svg = document.getElementById('orbit');
  const IA = 16 / 9, ZOOM = 1.06;
  const draw = () => {
    const W = hero.clientWidth, H = hero.clientHeight, sa = W / H;
    const sx = (sa > IA ? 1 : sa / IA) / ZOOM, sy = (sa > IA ? IA / sa : 1) / ZOOM;
    const cx = ((1.54 - .5) / sx + .5) * W, cy = ((1.3 - .5) / sy + .5) * H, R = 1.87 / sy * H;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const ring = (r, cls, dash, dotA) => {
      const a = dotA * Math.PI / 180;
      return `<g class="${cls}" style="transform-origin:${cx}px ${cy}px">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(233,236,230,.16)" stroke-width="1" stroke-dasharray="${dash}"/>
        <circle cx="${cx + r * Math.cos(a)}" cy="${cy + r * Math.sin(a)}" r="3.5" fill="#cfeee2" style="filter:drop-shadow(0 0 6px #9fd8c2)"/>
      </g>`;
    };
    svg.innerHTML = ring(R - .16 * R / 1.87, 'spin', '2 6', 228) + ring(R - .36 * R / 1.87, 'spin2', '', 205);
  };
  new ResizeObserver(draw).observe(hero);

  let s = 2 * 3600 + 14 * 60 + 9;
  const el = document.getElementById('clock'), p = n => String(n).padStart(2, '0');
  setInterval(() => { s = s > 0 ? s - 1 : 0; el.textContent = `${p(s / 3600 | 0)}:${p((s % 3600) / 60 | 0)}:${p(s % 60)}`; }, 1000);
})();
</script>
</body>
</html>
