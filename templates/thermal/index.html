<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thermal — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fff7ea; --muted:rgba(255,247,234,.62); --line:rgba(255,247,234,.16); --hot:#ff6a1a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#050304; color:var(--fg); font-family:"Red Hat Display",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .mono { font-family:"Red Hat Mono",monospace; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(5,3,4,.6),rgba(5,3,4,.25) 45%,transparent 70%); pointer-events:none; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:22px clamp(20px,4vw,56px); }
  .logo { font-weight:900; font-size:21px; letter-spacing:-.03em; display:flex; align-items:center; gap:8px; }
  .logo i { width:12px; height:22px; border-radius:3px; background:linear-gradient(180deg,#1b3a6b,#e3121e 45%,#ff8a1a 70%,#fff2c2); }
  .links { display:flex; gap:28px; font-size:15px; font-weight:500; color:var(--muted); }
  .links a:hover { color:var(--fg); }
  .nr { display:flex; gap:10px; align-items:center; font-size:15px; font-weight:500; }
  .nr .go { padding:10px 18px; border-radius:10px; background:var(--fg); color:#120806; font-weight:700; transition:background .25s; }
  .nr .go:hover { background:var(--hot); color:#fff; }

  .copy { padding:7vh clamp(20px,4vw,56px) 0; max-width:900px; }
  .badge { display:inline-flex; align-items:center; gap:10px; font-size:13px; padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge b { font-weight:700; color:#120806; background:var(--hot); padding:3px 9px; border-radius:999px; font-size:12px; }
  h1 { margin-top:22px; font-weight:900; font-size:clamp(50px,7.4vw,120px); line-height:.92; letter-spacing:-.05em; }
  h1 span { color:#ffd9a0; text-shadow:0 0 40px rgba(255,120,30,.55); }
  .sub { margin-top:20px; font-size:18px; line-height:1.55; color:rgba(255,247,234,.85); max-width:500px; text-shadow:0 1px 16px rgba(0,0,0,.45); }
  .ctas { margin-top:30px; display:flex; gap:12px; flex-wrap:wrap; }
  .cmd { display:inline-flex; align-items:center; gap:12px; padding:13px 18px; border-radius:12px; background:rgba(20,8,4,.6); border:1px solid rgba(255,247,234,.22); backdrop-filter:blur(12px); font-size:14px; }
  .cmd span { color:var(--hot); }
  .btn { padding:14px 24px; border-radius:12px; background:var(--fg); color:#120806; font-weight:700; transition:transform .25s, box-shadow .25s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(255,106,26,.4); }

  .prices { margin-top:auto; padding:0 clamp(20px,4vw,56px) 28px; display:flex; gap:10px; flex-wrap:wrap; }
  .gpu { display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:14px; background:rgba(20,8,4,.55); border:1px solid rgba(255,247,234,.22); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-size:14px; }
  .gpu b { font-weight:700; }
  .gpu em { font-style:normal; color:var(--muted); }
  .gpu i { width:8px; height:8px; border-radius:50%; background:#58e08a; box-shadow:0 0 8px #58e08a; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(8px); animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:820px){ .links{ display:none; } .nr .si{ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#"><i></i>furnace</a>
    <div class="links"><a href="#">GPUs</a><a href="#">Inference</a><a href="#">Pricing</a><a href="#">Docs</a></div>
    <div class="nr"><a class="si" href="#">Sign in</a><a class="go" href="#">Launch a GPU</a></div>
  </nav>

  <div class="copy">
    <span class="badge rv" style="--d:150"><b>New</b> B200 clusters in 6 regions</span>
    <h1 class="rv" style="--d:300">Compute that runs <span>hot.</span><br>Bills that don't.</h1>
    <p class="sub rv" style="--d:450">Spin up GPUs in seconds, pay per second, scale to zero when the demo's over. Built for teams that train at 3am.</p>
    <div class="ctas rv" style="--d:600"><a class="btn" href="#">Start with $50 credit</a><span class="cmd mono"><span>$</span> furnace up --gpu h200</span></div>
  </div>

  <div class="prices mono rv" style="--d:800" id="prices"></div>
</section>
<script src="bg.js"></script>
<script>
  // live-ish GPU price chips
  const gpus = [['B200', 3.49], ['H200', 2.29], ['H100', 1.89], ['A100', 1.09], ['L40S', .79]];
  const el = document.getElementById('prices');
  const draw = () => el.innerHTML = gpus.map(([n, p]) => `<div class="gpu"><i></i><b>${n}</b><em>$${(p + (Math.random() - .5) * .04).toFixed(2)}/hr</em></div>`).join('');
  draw(); setInterval(draw, 2500);
</script>
</body>
</html>
