<style>
  :root { --ink:#f4eefe; --muted:rgba(232,222,250,.66); --hot:#ff2f62; --gold:#ffc53a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0b0512; color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-2; display:block; }
  /* keeps the type readable over the stripes without hiding the sphere */
  .hero::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(90deg,rgba(8,3,14,.82) 0%,rgba(8,3,14,.55) 32%,rgba(8,3,14,0) 58%); }

  nav { display:flex; justify-content:space-between; align-items:center; padding:24px clamp(20px,4vw,56px); font-size:14px; }
  .logo { font-family:Syne,sans-serif; font-weight:800; font-size:19px; letter-spacing:.32em; text-transform:uppercase; }
  .links { display:flex; gap:30px; color:var(--muted); letter-spacing:.02em; }
  .links a:hover { color:var(--ink); }
  .nb { white-space:nowrap; font-family:Syne,sans-serif; font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }

  .copy { margin:auto 0; padding:0 clamp(20px,6vw,96px) 40px; max-width:820px; }
  .eyebrow { font-family:Syne,sans-serif; font-weight:700; font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--hot); display:flex; align-items:center; gap:12px; }
  .eyebrow::before { content:""; width:38px; height:2px; background:var(--hot); box-shadow:0 0 12px var(--hot); }
  h1 { margin-top:22px; font-family:Syne,sans-serif; font-weight:800; font-size:clamp(50px,min(7vw,12.5vh),124px); line-height:.9; letter-spacing:-.035em; text-transform:uppercase; }
  h1 span { display:block; }
  h1 .o { -webkit-text-stroke:2px var(--ink); color:transparent; }
  .sub { margin-top:24px; font-size:17px; line-height:1.6; color:var(--muted); max-width:430px; }
  .ctas { margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .btn { padding:15px 26px; border-radius:999px; font-weight:500; font-size:15px; transition:transform .25s, box-shadow .25s; }
  .btn.p { background:var(--ink); color:#12081e; } .btn.p:hover { transform:translateY(-2px); box-shadow:0 14px 44px rgba(255,47,98,.35); }
  .btn.g { border:1px solid rgba(244,238,254,.28); } .btn.g:hover { border-color:var(--ink); }

  /* now playing — the bars are driven by the same clock as the sphere's wake */
  .np { position:absolute; right:clamp(20px,4vw,56px); bottom:34px; display:flex; align-items:center; gap:16px; padding:12px 18px 12px 12px; border-radius:16px; background:rgba(14,6,24,.55); border:1px solid rgba(244,238,254,.12); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .art { width:46px; height:46px; border-radius:10px; background:radial-gradient(circle at 38% 34%,#fff 0 6%,#b9b8c4 14%,#3b3646 46%,transparent 48%),repeating-linear-gradient(118deg,#1a0d2e 0 3px,#b394e6 3px 6px); }
  .np b { display:block; font-size:14px; font-weight:500; } .np small { font-size:12px; color:var(--muted); }
  .eq { display:flex; gap:3px; align-items:flex-end; height:22px; margin-left:8px; }
  .eq i { width:3px; border-radius:2px; background:linear-gradient(var(--gold),var(--hot)); animation:eq 1s ease-in-out infinite alternate; }
  .eq i:nth-child(1){ animation-duration:.8s; } .eq i:nth-child(2){ animation-duration:1.1s; animation-delay:-.3s; }
  .eq i:nth-child(3){ animation-duration:.7s; animation-delay:-.5s; } .eq i:nth-child(4){ animation-duration:1.3s; animation-delay:-.2s; }
  .eq i:nth-child(5){ animation-duration:.9s; animation-delay:-.7s; }
  @keyframes eq { from { height:4px; } to { height:22px; } }

  .rv { opacity:0; transform:translateY(18px); filter:blur(10px); animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } .eq i{ animation:none; height:12px; } }
  @media (max-width:760px){ .links{ display:none; } .logo{ font-size:15px; letter-spacing:.24em; } .eyebrow{ font-size:11px; letter-spacing:.2em; } .hero::before{ background:rgba(8,3,14,.55); } .np{ display:none; } }
</style>

<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="logo" href="#">Undertow</a>
    <div class="links"><a href="#">Sessions</a><a href="#">Science</a><a href="#">Artists</a><a href="#">Pricing</a></div>
    <a class="nb" href="#">Open app ↗</a>
  </nav>

  <div class="copy">
    <p class="eyebrow rv" style="--d:200">Focus music · generated live</p>
    <h1 class="rv" style="--d:350"><span>Let the</span><span class="o">noise</span><span>bend.</span></h1>
    <p class="sub rv" style="--d:550">Undertow reads your pace and writes a soundtrack around it. Distractions part like water and you just keep moving.</p>
    <div class="ctas rv" style="--d:750"><a class="btn p" href="#">Start a session — free</a><a class="btn g" href="#">Hear a sample</a></div>
  </div>

  <div class="np rv" style="--d:1100" aria-hidden="true">
    <div class="art"></div>
    <div><b>Deep work · 92 bpm</b><small>Session 3 of 4 · 18:42 left</small></div>
    <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</section>
<script src="bg.js"></script>
</body>
