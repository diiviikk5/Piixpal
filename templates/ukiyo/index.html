<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ukiyo — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#f3ece2; --muted:rgba(243,236,226,.62); --line:rgba(243,236,226,.2); --ember:#e8743a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1f2a2e; color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; height:100vh; height:100svh; min-height:640px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { position:absolute; inset:0 0 auto; display:flex; justify-content:space-between; align-items:center; padding:26px clamp(20px,4vw,56px); font-size:12px; letter-spacing:.24em; text-transform:uppercase; }
  .mark { display:flex; align-items:center; gap:12px; font-family:"Cormorant Garamond",serif; font-size:24px; letter-spacing:.06em; text-transform:none; }
  .mark i { font-style:normal; font-family:"Noto Serif JP",serif; font-size:13px; padding:6px; border:1px solid var(--ember); color:var(--ember); }
  .links { display:flex; gap:30px; color:var(--muted); }
  .links a:hover { color:var(--fg); }

  /* vertical Japanese line, left */
  .tate { position:absolute; left:clamp(20px,4vw,56px); top:50%; transform:translateY(-50%); writing-mode:vertical-rl; font-family:"Noto Serif JP",serif; font-weight:300; font-size:clamp(18px,1.7vw,24px); letter-spacing:.5em; color:var(--muted); }

  .copy { position:absolute; right:clamp(20px,4vw,56px); top:50%; transform:translateY(-50%); max-width:290px; text-align:right; }
  .copy small { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--ember); }
  h1 { margin-top:14px; font-family:"Cormorant Garamond",serif; font-weight:400; font-size:clamp(36px,3.9vw,60px); line-height:1; }
  h1 em { font-style:italic; color:var(--muted); }
  .copy p { margin-top:16px; font-size:15px; line-height:1.7; color:var(--muted); }

  .reserve { position:absolute; left:50%; bottom:34px; transform:translateX(-50%); display:flex; align-items:center; gap:2px; border:1px solid var(--line); background:rgba(20,28,31,.5); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-size:13px; letter-spacing:.12em; text-transform:uppercase; }
  .reserve span { padding:16px 20px; color:var(--muted); border-right:1px solid var(--line); }
  .reserve span b { color:var(--fg); font-weight:500; margin-left:8px; }
  .reserve a { padding:16px 26px; background:var(--ember); color:#1a0e06; font-weight:500; transition:filter .3s; }
  .reserve a:hover { filter:brightness(1.1); }

  .rv { opacity:0; filter:blur(10px); animation:fade 2s ease forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes fade { to { opacity:1; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; filter:none; } }
  @media (max-width:900px){ .links,.tate{ display:none; } .copy{ top:auto; bottom:110px; transform:none; left:20px; right:20px; max-width:none; text-align:left; } .reserve span:nth-child(2){ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <a class="mark" href="#"><i>浮世</i>Ukiyo</a>
    <div class="links"><a href="#">Omakase</a><a href="#">Tea</a><a href="#">Garden</a><a href="#">Visit</a></div>
  </nav>

  <p class="tate rv" style="--d:400">静かな水に、灯りがゆれる</p>

  <div class="copy rv" style="--d:700">
    <small>Kyoto · Since 1912</small>
    <h1>Twelve seats.<br><em>One quiet evening.</em></h1>
    <p>A seasonal omakase served beside the water garden, by lantern light. Reservations open thirty days ahead.</p>
  </div>

  <div class="reserve rv" style="--d:1000">
    <span>Date<b>Fri, 14 Nov</b></span>
    <span>Guests<b>2</b></span>
    <a href="#">Reserve</a>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
