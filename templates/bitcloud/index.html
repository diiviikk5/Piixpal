<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bitcloud — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#1a1f3b; --paper:#f2eed2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); color:var(--paper); font-family:"IBM Plex Mono",monospace; -webkit-font-smoothing:none; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; cursor:crosshair; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; image-rendering:pixelated; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:20px clamp(18px,4vw,52px); font-size:13px; }
  .logo { display:flex; align-items:center; gap:10px; font-family:Silkscreen,monospace; font-size:18px; }
  .logo svg { width:26px; height:20px; }
  .links { display:flex; gap:26px; }
  .links a, .box { background:var(--ink); padding:4px 8px; box-shadow:0 0 0 2px var(--ink); }
  .links a:hover { background:var(--paper); color:var(--ink); }
  .copy { margin:auto 0; padding:0 clamp(18px,6vw,92px) 30px; max-width:760px; }
  .tag { display:inline-block; font-family:Silkscreen,monospace; font-size:12px; background:var(--paper); color:var(--ink); padding:6px 10px; }
  h1 { margin-top:18px; font-family:Silkscreen,monospace; font-weight:700; font-size:clamp(46px,8vw,120px); line-height:.95; letter-spacing:-.02em; }
  h1 span { display:inline-block; background:var(--ink); padding:0 .12em; }
  h1 em { font-style:normal; background:var(--paper); color:var(--ink); padding:0 .12em; }
  .sub { margin-top:22px; max-width:440px; font-size:15px; line-height:1.65; background:var(--ink); padding:12px 14px; box-shadow:4px 4px 0 var(--paper); }
  .ctas { margin-top:26px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn { font-family:Silkscreen,monospace; font-size:14px; padding:14px 20px; border:2px solid var(--paper); transition:transform .12s steps(2),box-shadow .12s steps(2); }
  .btn.p { background:var(--paper); color:var(--ink); box-shadow:5px 5px 0 var(--ink),5px 5px 0 2px var(--paper); }
  .btn.p:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink),7px 7px 0 2px var(--paper); }
  .btn.g { background:var(--ink); } .btn.g:hover { background:var(--paper); color:var(--ink); }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px clamp(18px,4vw,52px) 22px; font-size:12px; }
  .hint span { background:var(--ink); padding:4px 8px; }
  .hint b { font-family:Silkscreen,monospace; font-weight:400; }
  .rv { opacity:0; animation:blink .5s steps(3) forwards; animation-delay:calc(var(--d,0)*1ms + 200ms); }
  @keyframes blink { 0%{opacity:0} 40%{opacity:1} 60%{opacity:0} 100%{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; } }
  @media (max-width:760px){ .links{ display:none; } .foot .stats{ display:none; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>
  <nav class="rv"><a class="logo box" href="#"><svg viewBox="0 0 13 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M4 0h3v1h1v1h2v1h1v1h1v1h1v4H0V5h1V3h1V2h1V1h1z"/></svg>Bitcloud</a><div class="links"><a href="#">Features</a><a href="#">Pricing</a><a href="#">Log in</a></div></nav>
  <div class="copy">
    <span class="tag rv" style="--d:100">Encrypted · 1-bit simple</span>
    <h1 class="rv" style="--d:250"><span>Head in</span><br><span>the</span> <em>clouds.</em></h1>
    <p class="sub rv" style="--d:420">Private file storage with nothing extra. Drop files in, get a link out. 10 GB free, end-to-end encrypted, no tracking, ever.</p>
    <div class="ctas rv" style="--d:560"><a class="btn p" href="#">Start free</a><a class="btn g" href="#">How it works</a></div>
  </div>
  <div class="foot rv" style="--d:700"><p class="hint"><span><b>Move</b> the sun · <b>Drag</b> the wind · <b>Click</b> for thunder</span></p><p class="stats"><span class="box">99.99% uptime</span></p></div>
</section>
<script src="bg.js"></script>
</body>
</html>
