<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ember — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --fg:#fff8ef; --muted:rgba(255,248,239,.78); --line:rgba(255,248,239,.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#3a0610; color:var(--fg); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  .bar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:22px clamp(20px,4vw,48px); font-size:14px; }
  .brand { font-family:Unbounded,sans-serif; font-weight:800; letter-spacing:-.02em; font-size:17px; }
  .brand sup { font-weight:400; font-size:10px; margin-left:3px; }
  .when { color:var(--muted); display:flex; gap:10px; align-items:center; }
  .when i { width:7px; height:7px; border-radius:50%; background:#ffd36b; box-shadow:0 0 0 0 rgba(255,211,107,.7); animation:ping 2s infinite; }
  @keyframes ping { 70% { box-shadow:0 0 0 10px rgba(255,211,107,0); } 100% { box-shadow:0 0 0 0 rgba(255,211,107,0); } }
  .bar .reg { justify-self:end; padding:10px 18px; border-radius:999px; background:var(--fg); color:#3a0610; font-weight:600; transition:transform .25s; }
  .bar .reg:hover { transform:scale(1.04); }

  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 clamp(16px,3vw,40px); }
  .kicker { font-family:Unbounded,sans-serif; font-size:clamp(12px,1.1vw,15px); letter-spacing:.3em; text-transform:uppercase; text-align:center; color:var(--muted); }
  h1 { font-family:Unbounded,sans-serif; font-weight:800; font-size:clamp(64px,19.5vw,330px); line-height:.82; letter-spacing:-.06em; text-align:center; margin-top:16px; white-space:nowrap; }
  h1 span { display:inline-block; transform:translateY(60%) rotate(8deg); opacity:0; animation:pop 1.1s cubic-bezier(.2,.9,.2,1.1) forwards; }
  @keyframes pop { to { transform:none; opacity:1; } }

  .facts { margin:clamp(24px,5vh,56px) auto 0; display:grid; grid-template-columns:repeat(3,minmax(0,220px)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .facts div { padding:16px 20px; text-align:center; }
  .facts div + div { border-left:1px solid var(--line); }
  .facts small { display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .facts b { display:block; margin-top:6px; font-family:Unbounded,sans-serif; font-weight:600; font-size:clamp(16px,1.6vw,22px); font-variant-numeric:tabular-nums; }

  .ctas { margin-top:32px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .btn { padding:16px 28px; border-radius:999px; font-weight:600; font-size:15px; transition:transform .25s, background .25s; }
  .btn:hover { transform:translateY(-2px); }
  .btn.solid { background:#1a0207; color:var(--fg); }
  .btn.solid:hover { background:#000; }
  .btn.line { border:1px solid var(--line); backdrop-filter:blur(10px); background:rgba(255,255,255,.08); }

  .marquee { margin-top:auto; border-top:1px solid var(--line); overflow:hidden; padding:18px 0; -webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent); mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent); }
  .marquee .track { display:flex; gap:64px; width:max-content; animation:slide 30s linear infinite; font-family:Unbounded,sans-serif; font-size:16px; font-weight:600; letter-spacing:.02em; color:var(--muted); }
  .marquee .track span::before { content:"✺"; margin-right:64px; color:#ffd36b; font-weight:400; }
  @keyframes slide { to { transform:translateX(-50%); } }

  .rv { opacity:0; transform:translateY(14px); animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .rv,h1 span{ animation:none; opacity:1; transform:none; } .marquee .track{ animation:none; } }
  @media (max-width:700px){ .bar{ grid-template-columns:1fr auto; } .when{ display:none; } .facts{ grid-template-columns:1fr; } .facts div+div{ border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <header class="bar rv">
    <a class="brand" href="#">IGNITE<sup>26</sup></a>
    <span class="when"><i></i>Applications open · closes in <b id="cd">12d 04h 31m</b></span>
    <a class="reg" href="#">Register →</a>
  </header>

  <div class="stage">
    <p class="kicker rv" style="--d:200">The 48-hour hackathon</p>
    <h1 aria-label="Ignite" data-letters>IGNITE</h1>
    <div class="facts rv" style="--d:900">
      <div><small>When</small><b>Mar 14–16</b></div>
      <div><small>Where</small><b>Lisbon + Online</b></div>
      <div><small>Prizes</small><b>$50,000</b></div>
    </div>
    <div class="ctas rv" style="--d:1050">
      <a class="btn solid" href="#">Apply to hack</a>
      <a class="btn line" href="#">Become a sponsor</a>
    </div>
  </div>

  <div class="marquee rv" style="--d:1200" aria-label="Sponsors">
    <div class="track" id="track"><span>Lumen</span><span>Halcyon Capital</span><span>Vertex AI</span><span>Orbital</span><span>Kinfolk</span><span>Northwind</span><span>Prism Labs</span><span>Umbra</span></div>
  </div>
</section>
<script src="bg.js"></script>
<script>
  // staggered letters
  document.querySelectorAll('[data-letters]').forEach(el => {
    el.innerHTML = [...el.textContent].map((c, i) => `<span aria-hidden="true" style="animation-delay:${350 + i * 70}ms">${c}</span>`).join('');
  });
  // seamless marquee: duplicate the track once
  const tr = document.getElementById('track'); tr.innerHTML += tr.innerHTML;
  // countdown to a fixed deadline 12 days out from first load
  const end = Date.now() + ((12 * 24 + 4) * 60 + 31) * 60e3, cd = document.getElementById('cd');
  setInterval(() => { const s = Math.max(0, (end - Date.now()) / 1000 | 0); cd.textContent = `${s / 86400 | 0}d ${String((s % 86400) / 3600 | 0).padStart(2, '0')}h ${String((s % 3600) / 60 | 0).padStart(2, '0')}m`; }, 1000);
</script>
</body>
</html>
