<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sandstorm — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#2b1408; --muted:rgba(43,20,8,.66); --line:rgba(43,20,8,.2); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#d9a274; color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }

  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; padding:22px clamp(20px,4vw,56px) 28px; isolation:isolate; overflow:hidden; }
  [data-bg] { position:absolute; inset:0; width:100%; height:100%; z-index:-1; display:block; }

  nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:500; }
  .links { display:flex; gap:26px; }
  .brand { font-family:Italiana,serif; font-size:30px; letter-spacing:.3em; text-transform:uppercase; padding-left:.3em; }
  .right { justify-self:end; display:flex; gap:22px; }

  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .kick { font-size:13px; letter-spacing:.3em; text-transform:uppercase; font-weight:500; }
  h1 { font-family:Italiana,serif; font-weight:400; font-size:clamp(70px,13vw,220px); line-height:.86; letter-spacing:-.01em; margin-top:10px; }
  h1 span { display:block; padding-left:12vw; }
  .row { margin-top:28px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .shop { padding:16px 30px; background:var(--ink); color:#f6e3cf; font-size:13px; letter-spacing:.2em; text-transform:uppercase; font-weight:600; transition:background .3s, color .3s; }
  .shop:hover { background:#f6e3cf; color:var(--ink); }
  .row p { max-width:320px; font-size:14px; line-height:1.6; color:var(--muted); }

  .items { display:flex; gap:12px; justify-content:flex-end; }
  .item { width:150px; }
  .item i { display:block; aspect-ratio:3/4; border-radius:2px; background:linear-gradient(160deg,var(--a),var(--b)); box-shadow:0 20px 40px rgba(80,30,5,.25); transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .item:hover i { transform:translateY(-6px); }
  .item small { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; letter-spacing:.06em; }

  .rv { opacity:0; transform:translateY(16px); filter:blur(8px); animation:rise 1.3s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--d,0) * 1ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:blur(0); } }
  @media (prefers-reduced-motion:reduce){ .rv{ animation:none; opacity:1; transform:none; filter:none; } }
  @media (max-width:820px){ .links,.right a:not(:last-child){ display:none; } nav{ grid-template-columns:1fr auto; } .brand{ justify-self:start; } .items{ justify-content:flex-start; } .item{ width:30%; } h1 span{ padding-left:0; } }
</style>
</head>
<body>
<section class="hero">
  <canvas data-bg aria-hidden="true"></canvas>

  <nav class="rv">
    <div class="links"><a href="#">Women</a><a href="#">Men</a><a href="#">Journal</a></div>
    <a class="brand" href="#">Sirocco</a>
    <div class="right"><a href="#">Search</a><a href="#">Account</a><a href="#">Bag (0)</a></div>
  </nav>

  <div class="stage">
    <span class="kick rv" style="--d:200">Collection 04 — Spring / Summer</span>
    <h1 class="rv" style="--d:350">Made by<span>the wind.</span></h1>
    <div class="row rv" style="--d:600">
      <a class="shop" href="#">Shop the drop</a>
      <p>Linen, raw silk and sun-faded cotton, cut loose to move the way desert air does.</p>
    </div>
  </div>

  <!-- product tiles: swap each <i> for an <img> of the product (3:4) -->
  <div class="items rv" style="--d:800">
    <a class="item" href="#" style="--a:#f3d2b0;--b:#c97b45"><i></i><small><span>Dune shirt</span><span>$148</span></small></a>
    <a class="item" href="#" style="--a:#e9c39b;--b:#8e4a22"><i></i><small><span>Haboob coat</span><span>$320</span></small></a>
    <a class="item" href="#" style="--a:#f7e6d2;--b:#d39a68"><i></i><small><span>Sirocco wrap</span><span>$96</span></small></a>
  </div>
</section>
<script src="bg.js"></script>
</body>
</html>
