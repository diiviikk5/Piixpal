<script>
(() => {
const PALS = /*__PALS__*/null;
const W = 640, H = 360, BAR = 30, G = 262;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), pr = (t, a, b) => clamp((t - a) / (b - a));

/* foot point (x, y), s screen pixels per pal pixel */

/* ---------- the city ---------- */

const skyline = (cam, t, from = 0, to = 3, px = 0) => {

const street = (cam, t, lamps = true) => {

  for (let x = -((cam * 1.2) % 80); x < W; x += 80) rect(x, G + 48, 36, 3, '#3a3156');           /* lane dashes */
  for (let i = 0; i < 9; i++) { const px = (h1(i * 5.5) * W * 1.6 - cam * 1.2) % (W * 1.6); const wx = ((px % (W * 1.6)) + W * 1.6) % (W * 1.6) - 60; rect(wx, G + 14 + (i % 3) * 10, 28, 2, 'rgba(160,190,255,.18)'); }   /* puddles catching light */

    rect(lx, G - 96, 3, 96, '#2a2142'); rect(lx - 8, G - 98, 19, 4, '#2a2142');
    ctx.fillStyle = 'rgba(255,226,140,.14)'; ctx.beginPath(); ctx.moveTo(lx - 4, G - 94); ctx.lineTo(lx + 8, G - 94); ctx.lineTo(lx + 46, G); ctx.lineTo(lx - 42, G); ctx.fill();

  for (let i = 0; i < 110 * k; i++) { const sp = 380 + h1(i) * 220, y = (h1(i * 2.3) * H + t * sp) % H, x = ((h1(i * 5.1) * (W + 80) - t * 40 * wind) % (W + 80) + W + 80) % (W + 80) - 40; ctx.fillRect(Math.round(x), Math.round(y), 1, 6); ctx.fillRect(Math.round(x) - 1, Math.round(y) + 6, 1, 2); }
};
const speech = (str, x, y, t0, t) => {
  const k = eo(pr(t, t0, t0 + .18)); if (k <= 0) return;

const dust = (x, y, t0, t, n = 9) => { const u = t - t0; if (u < 0 || u > .7) return; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI - Math.PI, d = u * 60 * (.6 + h1(i)); ctx.fillStyle = `rgba(200,190,220,${.6 * (1 - u / .7)})`; ctx.fillRect(Math.round(x + Math.cos(a) * d), Math.round(y + Math.sin(a) * d * .5 - u * 14), 3, 3); } };

/* ---------- the scenes ---------- */
const L_CARD = 3.2, L_CITY = 8.8, L_ALLEY = 9, L_CHASE = 10, L_REVEAL = 11.2, L_CRED = 9;
const STARTS = [0, L_CARD, L_CARD + L_CITY, L_CARD + L_CITY + L_ALLEY, L_CARD + L_CITY + L_ALLEY + L_CHASE, L_CARD + L_CITY + L_ALLEY + L_CHASE + L_REVEAL];
const TOTAL = STARTS[5] + L_CRED;
const subs = [];   /* [absolute start, end, text] */
const SUB = (scene, a, b, s) => subs.push([STARTS[scene] + a, STARTS[scene] + b, s]);
SUB(1, .8, 3.6, 'It was a dark and stormy request.'); SUB(1, 4.6, 8.3, 'Somebody had stolen a page.');
SUB(2, 4.6, 6.2, '...'); SUB(2, 6.5, 8.9, 'Kitty knew nothing.');
SUB(3, .6, 3.4, 'A chase through the rainy streets.'); SUB(3, 4.2, 6.4, 'Pip had the zero.'); SUB(3, 7.4, 9.8, 'The penguin saw everything.');
SUB(4, .5, 2.8, 'The truth was simple.'); SUB(4, 3.3, 6.2, 'There was never a page.'); SUB(4, 6.6, 10.6, 'Case closed.');
let shake = 0;

function card(t) {
  rect(0, 0, W, H, '#000');
  const a = Math.min(pr(t, .2, 1), 1 - pr(t, 2.5, 3.1));
  ctx.globalAlpha = a;

  text('PIIXPAL', W / 2 - 36, 135, 24, '#f3eee3', 'left');
  text('PICTURES', W / 2, 168, 16, '#c6f432', 'center');
  text('PRESENTS', W / 2, 200, 8, '#8d84a6', 'center'); ctx.globalAlpha = 1;

  if ((t > 4.5 && t < 4.58) || (t > 4.72 && t < 4.8)) rect(0, 0, W, H, 'rgba(255,255,255,.55)');
  /* title, fading out */
  const ta = Math.min(pr(t, .5, 1.1), 1 - pr(t, 4.2, 4.8)); if (ta > 0) { ctx.globalAlpha = ta; text('THE CASE OF', W / 2, 106, 16, '#f3eee3', 'center', '#ff5ea8'); text('THE MISSING PAGE', W / 2, 142, 24, '#c6f432', 'center', '#25103f'); ctx.globalAlpha = 1; }
}
function alley(t) {

  for (let y = 0; y < G; y += 10) { rect(0, y, W, 1, '#150c26'); for (let x = (y / 10 % 2) * 14; x < W; x += 28) rect(x, y, 1, 10, '#150c26'); }
  for (let i = 0; i < 160; i++) { rect(h1(i) * W, h1(i * 3) * G, 4, 2, i % 3 ? '#26173a' : '#2f1d44'); }   /* worn bricks */
  /* the lamp, and its light on the wall */
  ctx.fillStyle = 'rgba(255,226,140,.12)'; ctx.beginPath(); ctx.moveTo(244, 40); ctx.lineTo(262, 40); ctx.lineTo(380, G); ctx.lineTo(130, G); ctx.fill(); rect(252, 40, 3, G - 40, '#2a2142'); rect(236, 34, 30, 5, '#2a2142'); rect(240, 39, 22, 3, '#ffe28c');
  rect(0, G, W, H - G, '#150f26'); rect(0, G, W, 3, '#2a2142');
  /* the ledge: a fire escape with rails, kitty's spot */

  /* a dumpster, steam from a grate */
  rect(70, G - 44, 90, 44, '#1f4a3a'); rect(70, G - 48, 94, 6, '#2a6a52'); rect(80, G - 36, 70, 2, '#163528'); rect(80, G - 24, 70, 2, '#163528');
  for (let i = 0; i < 5; i++) { const u = ((t * .55 + i * .2) % 1); ctx.fillStyle = `rgba(210,200,235,${.22 * (1 - u)})`; const sz = 6 + u * 16; ctx.fillRect(Math.round(560 + Math.sin(u * 6 + i) * 9 - sz / 2), Math.round(G - 4 - u * 70), Math.round(sz), Math.round(sz * .7)); }
